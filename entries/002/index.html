      <h1>From a page full of tries, to the one that stuck.</h1>
      <p class="intro">
        I explored multiple directions for this mark before landing on the one that shipped. Below: each one, from first
        sketch, to a cleaned-up Illustrator artboard, to a quick animation test of how it might move — 01 to 07.
