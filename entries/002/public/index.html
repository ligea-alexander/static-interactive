<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Identity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="styles.css?v=4" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/GSDevTools.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/EasePack.min.js"></script>
    <script defer src="animations/primitive.js?v=8"></script>
    <script defer src="animations/butterfly.js?v=18"></script>
    <script defer src="script.js?v=11"></script>
  </head>
  <body>
    <div class="project-header" id="project-header">
      <h1>From first sketches to systems in motion.</h1>
      <p class="intro">
        I explored nine logo directions for PixlBloom NYC, each moving from its originating sketch to an Illustrator study and
        animation test — 01 to 09.</p>
        <button class="intro-link" id="open-lightbox">View full sketch</button>
      </p>
    </div>

    <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <svg
        id="theme-icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <svg
        id="theme-icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="display: none"
      >
        <path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5Z" />
      </svg>
      <span class="tooltip" id="theme-tooltip">Switch to dark mode</span>
    </button>

    <div class="rail" id="rail"></div>

    <div class="hint mono" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M13 5l7 7-7 7" />
      </svg>
      scroll to explore
    </div>

    <div class="deck">
      <div class="track" id="track">
        <!-- slides are rendered by JS from the `directions` array below -->
      </div>
    </div>

    <div class="panel-overlay" id="panel-overlay"></div>
    <aside class="notes-panel" id="notes-panel">
      <button class="mono panel-close" id="panel-close">Close</button>
      <p class="mono panel-num" id="panel-num"></p>
      <h3 id="panel-title"></h3>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <div class="lightbox-overlay" id="lightbox-overlay">
      <div class="lightbox-inner">
        <button class="lightbox-close" id="lightbox-close">Close ✕</button>
        <img src="../img/logos_class_sketch1.JPG" alt="Full sketch page, larger view" />
      </div>
    </div>
  </body>
</html>
